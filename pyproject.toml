[project]
name = "payload-cache"
version = "0.1.0"
description = "Caching microservice that builds payloads from transformed strings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[project.scripts]
cache-cli = "cache_cli.main:main"
cache-service = "cache_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_service", "src/cache_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
