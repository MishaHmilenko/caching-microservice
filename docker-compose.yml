services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Redis is only a cache in front of Postgres, so it needs no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job so the schema is migrated exactly once, however many app replicas follow.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      CACHE_DATABASE_URL: postgresql+asyncpg://cache:cache@postgres:5432/cache
    depends_on:
      postgres:
        condition: service_healthy

  cache:
    build: .
    environment:
      CACHE_DATABASE_URL: postgresql+asyncpg://cache:cache@postgres:5432/cache
      CACHE_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
